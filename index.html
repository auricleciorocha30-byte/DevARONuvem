
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DevARONuvem</title>
    <meta name="description" content="Sistema completo para padarias e confeitarias com cardápio digital, gestão de mesas, pedidos de balcão/entrega, painel TV e programa de fidelidade.">
    <meta property="og:title" content="DevARONuvem">
    <meta property="og:description" content="Sistema completo para padarias e confeitarias com cardápio digital, gestão de mesas, pedidos de balcão/entrega, painel TV e programa de fidelidade.">
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="G&C Staff">
    <meta name="theme-color" content="#001F3F">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="manifest" id="app-manifest" href="/api/manifest">

    <script>
      (function() {
        function getStoreSlugFromLocation() {
          try {
            var urlParams = new URLSearchParams(window.location.search);
            var loja = urlParams.get('loja') || '';
            var hash = window.location.hash || '';
            if (!loja && hash.indexOf('?') !== -1) {
              var hashParams = new URLSearchParams(hash.split('?')[1]);
              loja = hashParams.get('loja') || '';
            }
            if (loja) {
              try {
                localStorage.setItem('last_store_slug', loja);
                localStorage.setItem('storeSlug', loja);
              } catch (e) {}
              return loja;
            }
            return localStorage.getItem('last_store_slug') || localStorage.getItem('storeSlug') || '';
          } catch (e) {
            return '';
          }
        }

        function normalizeAppType(raw) {
          var t = (raw || '').toLowerCase().trim();
          if (t === 'pdv' || t === 'caixa') return 'pdv';
          if (t === 'atendente' || t === 'atendimento') return 'atendente';
          if (t === 'entregador' || t === 'entregas') return 'entregador';
          if (t === 'cardapio') return 'cardapio';
          if (t === 'cozinha' || t === 'producao') return 'cozinha';
          if (t === 'tv') return 'tv';
          return '';
        }

        function getRouteForType(type) {
          if (type === 'pdv') return '/pdv';
          if (type === 'atendente') return '/atendimento';
          if (type === 'entregador') return '/entregas';
          if (type === 'cardapio') return '/cardapio';
          if (type === 'cozinha') return '/cozinha';
          if (type === 'tv') return '/tv';
          return '';
        }

        function detectCurrentAppType() {
          try {
            var urlParams = new URLSearchParams(window.location.search);
            var fromQuery = normalizeAppType(urlParams.get('type'));
            var hash = window.location.hash || '';
            if (!fromQuery && hash.indexOf('?') !== -1) {
              var hashParams = new URLSearchParams(hash.split('?')[1]);
              fromQuery = normalizeAppType(hashParams.get('type'));
            }
            if (fromQuery) {
              try { localStorage.setItem('pwa_installed_type', fromQuery); } catch (e) {}
              return fromQuery;
            }

            var hashPath = hash.split('?')[0];
            if (hashPath.indexOf('/pdv') !== -1) return 'pdv';
            if (hashPath.indexOf('/atendimento') !== -1) return 'atendente';
            if (hashPath.indexOf('/entregas') !== -1) return 'entregador';
            if (hashPath.indexOf('/cardapio') !== -1 && hashPath.indexOf('/cardapio-admin') === -1) return 'cardapio';
            if (hashPath.indexOf('/cozinha') !== -1) return 'cozinha';
            if (hashPath.indexOf('/tv') !== -1) return 'tv';

            var isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
            var isRootHash = !hashPath || hashPath === '#' || hashPath === '#/';
            if (isStandalone && isRootHash) {
              var savedType = normalizeAppType(localStorage.getItem('pwa_installed_type'));
              if (savedType) return savedType;
            }
          } catch (e) {}
          return '';
        }

        window.__detectPWAAppType = detectCurrentAppType;
        window.__getPWAStoreSlug = getStoreSlugFromLocation;

        // 1. Redireciona imediatamente para o módulo correto (PDV, Atendimento, Entregas, Cardápio, Cozinha, TV)
        try {
          var activeType = detectCurrentAppType();
          var activeLoja = getStoreSlugFromLocation();
          var currentHash = window.location.hash || '';
          var currentHashPath = currentHash.split('?')[0];
          var isAtRoot = !currentHashPath || currentHashPath === '#' || currentHashPath === '#/';

          if (activeType && isAtRoot) {
            var targetRoute = getRouteForType(activeType);
            if (targetRoute) {
              var lojaSuffix = activeLoja ? ('?loja=' + encodeURIComponent(activeLoja)) : '';
              window.location.replace(window.location.pathname + window.location.search + '#' + targetRoute + lojaSuffix);
            }
          }
        } catch (e) {}

        // 2. Sincroniza o link do manifest com o módulo e a unidade correspondente
        window.syncManifestLink = function(forcedType) {
          try {
            var type = normalizeAppType(forcedType) || detectCurrentAppType();
            var loja = getStoreSlugFromLocation();
            var manifestEl = document.getElementById('app-manifest');
            if (manifestEl) {
              var params = new URLSearchParams();
              if (type) params.set('type', type);
              if (loja) params.set('loja', loja);
              var targetHref = '/api/manifest' + (params.toString() ? '?' + params.toString() : '');
              if (manifestEl.getAttribute('href') !== targetHref) {
                manifestEl.setAttribute('href', targetHref);
              }
            }
          } catch (e) {}
        };

        window.syncManifestLink();
        window.addEventListener('hashchange', function() { window.syncManifestLink(); });
        window.addEventListener('popstate', function() { window.syncManifestLink(); });

        // 3. Captura global do evento de instalação PWA
        window.deferredPWAInstallPrompt = null;
        window.deferredPWAInstallType = '';

        function triggerAutoInstallIfRequested() {
          try {
            var urlParams = new URLSearchParams(window.location.search);
            var hash = window.location.hash || '';
            if (urlParams.get('auto_install') === 'true' || urlParams.get('auto_install') === '1' || hash.indexOf('auto_install=true') !== -1 || hash.indexOf('auto_install=1') !== -1) {
              var detected = detectCurrentAppType();
              if (detected) {
                try { localStorage.setItem('pwa_installed_type', detected); } catch (e) {}
              }
              setTimeout(function() {
                if (window.deferredPWAInstallPrompt && typeof window.deferredPWAInstallPrompt.prompt === 'function') {
                  window.deferredPWAInstallPrompt.prompt().then(function(choice) {
                    if (choice && choice.outcome === 'accepted') {
                      window.dispatchEvent(new CustomEvent('pwa-installed'));
                    }
                  }).catch(function(err) {
                    console.warn('[PWA] Prompt automático:', err);
                  });
                }
              }, 300);
            }
          } catch (err) {}
        }

        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.syncManifestLink();
          window.deferredPWAInstallPrompt = e;
          window.deferredPWAInstallType = detectCurrentAppType();
          window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
          triggerAutoInstallIfRequested();
        });

        window.addEventListener('appinstalled', function() {
          var installedType = detectCurrentAppType();
          if (installedType) {
            try { localStorage.setItem('pwa_installed_type', installedType); } catch (e) {}
          }
          window.deferredPWAInstallPrompt = null;
          window.dispatchEvent(new CustomEvent('pwa-installed'));
        });
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #001F3F;
            --secondary-color: #FFD700;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fffaf0;
            overscroll-behavior-y: contain;
        }
        .font-brand {
            font-family: 'Playfair Display', serif;
        }
        .bg-primary { background-color: var(--primary-color); }
        .bg-secondary { background-color: var(--secondary-color); }
        .text-primary { color: var(--primary-color); }
        .text-secondary { color: var(--secondary-color); }
        .border-primary { border-color: var(--primary-color); }
        .border-secondary { border-color: var(--secondary-color); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        
        @media print {
            @page { margin: 0; }
            body { margin: 1.6cm; }
        }

        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-scale-up { animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
    <script>
      // Anti-Flicker de Tema
      (function() {
        try {
          const cached = localStorage.getItem('gc-conveniencia-settings-v1');
          if (cached) {
            const settings = JSON.parse(cached);
            if (settings.primaryColor) document.documentElement.style.setProperty('--primary-color', settings.primaryColor);
            if (settings.secondaryColor) document.documentElement.style.setProperty('--secondary-color', settings.secondaryColor);
          }
        } catch (e) {}
      })();

      // Registro permanente do Service Worker para PWA (executa imediatamente ou no load)
      if ('serviceWorker' in navigator) {
        function registerSW() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[PWA] Service Worker registrado no escopo:', reg.scope);
            })
            .catch(function(err) {
              console.log('[PWA] Falha ao registrar Service Worker:', err);
            });
        }
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          registerSW();
        } else {
          window.addEventListener('load', registerSW);
        }
      }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
</body>
</html>
