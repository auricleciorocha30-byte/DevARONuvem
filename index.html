
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DevARONuvem</title>
    <meta name="description" content="Sistema completo para padarias e confeitarias com cardápio digital, gestão de mesas, pedidos de balcão/entrega, painel TV e programa de fidelidade.">
    <meta property="og:title" content="DevARONuvem">
    <meta property="og:description" content="Sistema completo para padarias e confeitarias com cardápio digital, gestão de mesas, pedidos de balcão/entrega, painel TV e programa de fidelidade.">
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="G&C Staff">
    <meta name="theme-color" content="#001F3F">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="manifest" id="app-manifest" href="/manifest.json">

    <script>
      // Restaura rota específica pelo parâmetro type (ex: atalhos criados na área de trabalho ou celular)
      (function() {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const type = (urlParams.get('type') || '').toLowerCase();
          const hash = window.location.hash || '';
          if (type && (!hash || hash === '#' || hash === '#/')) {
            if (type === 'pdv') window.location.hash = '#/pdv';
            else if (type === 'atendente' || type === 'atendimento') window.location.hash = '#/atendimento';
            else if (type === 'entregador' || type === 'entregas') window.location.hash = '#/entregas';
            else if (type === 'cardapio') window.location.hash = '#/cardapio';
          }
        } catch (e) {}
      })();

      // Sincroniza o link do manifest com o tipo e a unidade correspondente
      function syncManifestLink() {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const hash = window.location.hash || '';
          let type = urlParams.get('type') || '';
          let loja = urlParams.get('loja') || '';

          if (!type) {
            if (hash.includes('/pdv')) type = 'pdv';
            else if (hash.includes('/atendimento')) type = 'atendente';
            else if (hash.includes('/entregas')) type = 'entregador';
            else if (hash.includes('/cardapio')) type = 'cardapio';
          }

          if (!loja && hash.includes('loja=')) {
            const hashParts = hash.split('?');
            if (hashParts[1]) {
              const hashParams = new URLSearchParams(hashParts[1]);
              loja = hashParams.get('loja') || '';
            }
          }

          if (!loja) {
            try {
              loja = localStorage.getItem('last_store_slug') || localStorage.getItem('storeSlug') || '';
            } catch (e) {}
          }

          const manifestEl = document.getElementById('app-manifest');
          if (manifestEl) {
            const params = new URLSearchParams();
            if (type) params.set('type', type);
            if (loja) params.set('loja', loja);
            const targetHref = '/manifest.json' + (params.toString() ? '?' + params.toString() : '');
            if (manifestEl.getAttribute('href') !== targetHref) {
              manifestEl.setAttribute('href', targetHref);
            }
          }
        } catch (e) {}
      }
      syncManifestLink();
      window.addEventListener('hashchange', syncManifestLink);

      // Captura global do evento de instalação PWA antes de qualquer componente carregar
      window.deferredPWAInstallPrompt = null;

      function triggerAutoInstallIfRequested(e) {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const hash = window.location.hash || '';
          if (urlParams.get('auto_install') === 'true' || urlParams.get('auto_install') === '1' || hash.includes('auto_install=true') || hash.includes('auto_install=1')) {
            console.log('[PWA] Auto-instalação requisitada via parâmetro. Disparando prompt...');
            setTimeout(function() {
              if (window.deferredPWAInstallPrompt && typeof window.deferredPWAInstallPrompt.prompt === 'function') {
                window.deferredPWAInstallPrompt.prompt().then(function(choice) {
                  if (choice && choice.outcome === 'accepted') {
                    window.dispatchEvent(new CustomEvent('pwa-installed'));
                  }
                }).catch(function(err) {
                  console.warn('[PWA] Prompt automático completado:', err);
                });
              }
            }, 300);
          }
        } catch (err) {
          console.warn('[PWA] Erro na detecção de auto-instalação:', err);
        }
      }

      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
        console.log('[PWA] Evento beforeinstallprompt capturado com sucesso.');
        triggerAutoInstallIfRequested(e);
      });

      window.addEventListener('appinstalled', function() {
        window.deferredPWAInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
        console.log('[PWA] Aplicativo instalado no sistema com sucesso.');
      });
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #001F3F;
            --secondary-color: #FFD700;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fffaf0;
            overscroll-behavior-y: contain;
        }
        .font-brand {
            font-family: 'Playfair Display', serif;
        }
        .bg-primary { background-color: var(--primary-color); }
        .bg-secondary { background-color: var(--secondary-color); }
        .text-primary { color: var(--primary-color); }
        .text-secondary { color: var(--secondary-color); }
        .border-primary { border-color: var(--primary-color); }
        .border-secondary { border-color: var(--secondary-color); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        
        @media print {
            @page { margin: 0; }
            body { margin: 1.6cm; }
        }

        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-scale-up { animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
    <script>
      // Anti-Flicker de Tema
      (function() {
        try {
          const cached = localStorage.getItem('gc-conveniencia-settings-v1');
          if (cached) {
            const settings = JSON.parse(cached);
            if (settings.primaryColor) document.documentElement.style.setProperty('--primary-color', settings.primaryColor);
            if (settings.secondaryColor) document.documentElement.style.setProperty('--secondary-color', settings.secondaryColor);
          }
        } catch (e) {}
      })();

      // Registro permanente do Service Worker para PWA (executa imediatamente ou no load)
      if ('serviceWorker' in navigator) {
        function registerSW() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[PWA] Service Worker registrado no escopo:', reg.scope);
            })
            .catch(function(err) {
              console.log('[PWA] Falha ao registrar Service Worker:', err);
            });
        }
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          registerSW();
        } else {
          window.addEventListener('load', registerSW);
        }
      }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
</body>
</html>
